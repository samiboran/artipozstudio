<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Yönlendiriliyor…</title>
    <script type="text/javascript">
      // GitHub Pages'te client-side (React Router) rotalarına doğrudan
      // girildiğinde (link'e tıklamadan, URL'i yapıştırarak/refresh ile)
      // sunucu bu path'i bulamayıp buraya düşer. Path'i query string'e
      // kodlayıp index.html'e geri yönlendiriyoruz; index.html'deki script
      // bunu geri çözüp React Router'a doğru path'i veriyor.
      var pathSegmentsToKeep = 1; // '/fossilgarden' kısmını koru
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
