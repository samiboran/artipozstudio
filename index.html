<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title/description/OG/canonical BURADA YOK — Seo.jsx (react-helmet-async)
         tek kaynak. Bunlar burada da olursa Helmet'in kendisi tarafından
         eklenen etiketlerin YANINA (üstüne değil) eklenmiş oluyor, çünkü
         Helmet burada zaten var olan (kendisinin yönetmediği) statik
         etiketleri silmiyor — sonuç: aynı sayfada 2-3 tane <title>/<meta
         name="description">/og:* birden. App.jsx'teki varsayılan <Seo>
         bileşeni, kendi <Seo>'su olmayan sayfalar (admin, login vb.) için
         tek ve GERÇEK fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // 404.html'in kodladığı path'i geri çözüp gerçek URL'e yazıyoruz —
      // React Router mount olmadan ÖNCE çalışması için <head>'de, en üstte.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
