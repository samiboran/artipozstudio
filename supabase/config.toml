[functions.send-order-email]
enabled = false
verify_jwt = true
import_map = "./functions/send-order-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-order-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-order-email/*.html" ]
# create-order fonksiyonu bunun yerine geçti (fiyat doğrulaması server-side yapılıyor).
# Test ettikten sonra bu fonksiyonu ve klasörünü tamamen silebilirsin.

[functions.create-order]
enabled = true
verify_jwt = true
import_map = "./functions/create-order/deno.json"
entrypoint = "./functions/create-order/index.ts"

[functions.create-photo-print-order]
enabled = true
verify_jwt = true
import_map = "./functions/create-photo-print-order/deno.json"
entrypoint = "./functions/create-photo-print-order/index.ts"